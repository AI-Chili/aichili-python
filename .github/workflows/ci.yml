name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
      - "chore/**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} Test, Wheel, Twine & MCP Smoke
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify zero runtime dependencies in pyproject.toml
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path("pyproject.toml").read_text(encoding="utf-8")
          assert re.search(r"^dependencies\s*=\s*\[\s*\]$", text, re.MULTILINE), "dependencies must be empty []"
          PY

      - name: Run zero-dependency unit, CLI, MCP stdio & live registry test suite
        run: python -m unittest discover -s tests -v

      - name: Build sdist + wheel and run twine check
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check --strict dist/*

      - name: Install wheel in clean isolated venv (--no-deps) & smoke-test CLI + MCP stdio
        run: |
          python -m venv /tmp/aichili-clean-venv
          /tmp/aichili-clean-venv/bin/pip install --no-deps dist/*.whl
          test "$(/tmp/aichili-clean-venv/bin/aichili --version)" = "1.0.1"
          /tmp/aichili-clean-venv/bin/aichili estimate --seconds 90 --resolution 768p --json > /tmp/est.json
          python - <<'PY'
          import json
          data = json.loads(open("/tmp/est.json", encoding="utf-8").read())
          assert data["totalCredits"] == 90
          assert data["billableCredits"] == 65
          assert data["recommendedPack"]["id"] == "starter"
          PY
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"ci-wheel","version":"1.0.1"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"ping"}' \
            '{"jsonrpc":"2.0","id":3,"method":"tools/list"}' \
            | /tmp/aichili-clean-venv/bin/aichili-mcp > /tmp/mcp-wheel-out.jsonl
          python - <<'PY'
          import json
          frames = [json.loads(line) for line in open("/tmp/mcp-wheel-out.jsonl", encoding="utf-8").read().strip().splitlines()]
          assert len(frames) == 3, frames
          assert frames[0]["id"] == 1
          assert frames[0]["result"]["protocolVersion"] == "2025-03-26"
          assert frames[0]["result"]["serverInfo"]["name"] == "io.github.AI-Chili/aichili"
          assert frames[0]["result"]["serverInfo"]["version"] == "1.0.1"
          assert frames[1] == {"jsonrpc": "2.0", "id": 2, "result": {}}
          assert frames[2]["id"] == 3
          assert len(frames[2]["result"]["tools"]) == 7
          PY

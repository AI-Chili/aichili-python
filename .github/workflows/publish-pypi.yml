name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    name: Build, Verify & Publish to PyPI via Trusted Publisher OIDC
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/aichili

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify release tag matches package version & run test suite
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os, sys
          sys.path.insert(0, "src")
          from aichili import VERSION
          tag = os.environ["RELEASE_TAG"].lstrip("v")
          assert tag == VERSION, f"Release tag {os.environ['RELEASE_TAG']!r} does not match aichili.VERSION {VERSION!r}"
          PY
          python -m unittest discover -s tests -v

      - name: Build sdist and wheel & check metadata
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check --strict dist/*

      - name: Publish distribution to PyPI via OIDC Trusted Publisher
        uses: pypa/gh-action-pypi-publish@release/v1
